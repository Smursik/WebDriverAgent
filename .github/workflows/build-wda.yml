name: Build WDA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build WDA (unsigned)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package into IPA
        run: |
          cd build/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -r WebDriverAgentRunner-Runner.app Payload/ || cp -r *.app Payload/
          zip -r WebDriverAgentRunner.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wda-ipa
          path: build/Build/Products/Debug-iphoneos/WebDriverAgentRunner.ipa
